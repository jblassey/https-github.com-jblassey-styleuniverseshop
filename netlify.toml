[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Ensures client-side routes (e.g. /shop, /product/123) don't 404 on a
# hard refresh or direct link — Netlify falls back to index.html and
# React Router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
